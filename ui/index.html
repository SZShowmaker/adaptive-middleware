<script>
const token='__TOKEN__';let model,history=[],future=[],revision=0,generationRevision=0,savedSnapshot=null,hasSaved=false;const $=id=>document.getElementById(id);const clone=x=>JSON.parse(JSON.stringify(x));
function el(tag,text,cls){let x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function change(fn){let old=clone(model);try{fn();history.push(old);if(history.length>50)history.shift();future=[];revision++;render()}catch(e){model=old;render();throw e}}
function report(text,error=false){$('result').textContent='';$('status').textContent=text;$('status').className=error?'error':'';$('resultMessages').replaceChildren();$('resultMessages').hidden=true;if(error){const item=el('li',text);$('resultMessages').append(item);$('resultMessages').hidden=false;}}
async function api(action,data){let r=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-AMW-Token':token},body:JSON.stringify(data)});let v=await r.json();if(!r.ok)throw Error(v.error);return v}
function modal(title,node,apply,ready=()=>true){$('dialogTitle').textContent=title;$('dialogBody').replaceChildren(node);$('apply').disabled=!ready();$('apply').onclick=async()=>{try{$('apply').disabled=true;await apply();$('dialog').close()}catch(e){alert(e.message)}finally{$('apply').disabled=!ready()}};$('dialog').showModal()}
$('cancel').onclick=()=>$('dialog').close();
function editJson(title,value,apply){let area=el('textarea');area.value=JSON.stringify(value,null,2);modal(title,area,async()=>apply(await api('parse',{text:area.value})))}
function select(items){let s=el('select');for(const [value,label]of items){let o=el('option',label);o.value=value;s.append(o)}return s}
function service(ref){return model.project.service_interfaces.find(x=>x.id===ref.ref&&x.version===ref.version)}
function render(){
 renderIdentity();renderTypeLibrary();
 $('apps').replaceChildren();for(const app of model.project.apps){let card=el('div',undefined,'app'),head=el('header');head.append(el('h2',app.id));let actions=el('div'),add=el('button','增加输出'),sub=el('button','选择输入'),rename=el('button','重命名'),del=el('button','删除');actions.append(add,sub,rename,del);head.append(actions);card.append(head);
 add.onclick=()=>addOutput(app.id);sub.onclick=()=>subscribe(app.id);rename.onclick=()=>{let n=prompt('新的 App ID（会更新连接与实例引用）',app.id);if(n&&n!==app.id)change(()=>{if(model.project.apps.some(a=>a.id===n))throw Error('App 已存在');let old=app.id;app.id=n;model.project.connections.forEach(c=>{if(c.from.app===old)c.from.app=n;if(c.to.app===old)c.to.app=n});model.deployment.instances.forEach(i=>{if(i.app===old)i.app=n})})};del.onclick=()=>{if(confirm('删除 App 及相关连接、部署实例？受影响的其他实例输入需重新绑定。'))change(()=>{model.project.apps=model.project.apps.filter(a=>a!==app);model.project.connections=model.project.connections.filter(c=>c.from.app!==app.id&&c.to.app!==app.id);model.deployment.instances=model.deployment.instances.filter(i=>i.app!==app.id)})};
 for(const p of app.provides){const s=service(p.interface),group=el('div'),row=el('div',undefined,'row'),add=el('button','添加消息');add.onclick=()=>addOutput(app.id,p.id);row.append(el('strong','输出分组：'+p.id),add);group.append(row);for(const e of s?.events||[])group.append(el('div','输出 '+p.id+'.'+e.name+' → '+e.type.ref,'port'));card.append(group)}
 for(const p of app.requires){const s=service(p.interface),group=el('div'),row=el('div',undefined,'row'),edit=el('button','编辑订阅');edit.setAttribute('aria-label','编辑订阅 '+p.id);edit.onclick=()=>subscribe(app.id,p.id);row.append(el('strong','输入分组：'+p.id),edit);group.append(row);for(const e of s?.events||[])if(p.events.includes(e.id))group.append(el('div','输入 '+p.id+'.'+e.name+' ← '+e.type.ref,'port input'));card.append(group)}
 if(!app.provides.length&&!app.requires.length)card.append(el('p','尚未配置输入或输出消息','muted'));$('apps').append(card)}
 if(!model.project.apps.length)$('apps').append(el('p','还没有 App。点击“添加 App”，开始定义输入和输出消息。','empty-state'));
 renderConnections();$('instanceCount').textContent=model.deployment.instances.length+' 个实例';
 $('instances').replaceChildren();for(const i of model.deployment.instances){const row=el('div',undefined,'row'),button=el('button','配置');button.onclick=()=>openQos(i.id);row.append(el('span',i.id+' · '+i.app),button);$('instances').append(row)}
}
// The diagram shows logical App connections, not deployment instances or live traffic.
let selectedConnection=null,flowScale=1,flowSize=null,flowAutoFit=true;
const connectionKey=c=>JSON.stringify([c.from.app,c.from.provided,c.to.app,c.to.required]);
function renderIdentity(){
 refreshGenerationPaths();
 const name=model.project.project_id,dirty=JSON.stringify(model)!==savedSnapshot;
 $('projectName').textContent=name;
 $('projectState').textContent=dirty?'未保存更改':(hasSaved?'草稿已保存':'工程已载入');
 $('projectState').className=dirty?'unsaved':'saved';
 $('projectStats').textContent=`${model.project.apps.length} 个 App · ${model.project.connections.length} 条连接`;
 $('dirty').textContent=dirty?'当前更改尚未保存到草稿':'可继续编辑，生成代码前请校验';
 document.title=(dirty?'* ':'')+name+' · Adaptive Middleware';
}
function svgEl(tag,attributes={},text){
 const node=document.createElementNS('http://www.w3.org/2000/svg',tag);
 for(const [key,value] of Object.entries(attributes))node.setAttribute(key,String(value));
 if(text!==undefined)node.textContent=text;
 return node;
}
function flowZoom(scale){
 flowScale=Math.max(.3,Math.min(2,scale));

function flowRanks(apps,connections){

  index.set(id,next);low.set(id,next++);stack.push(id);active.add(id);
  for(const to of links.get(id)){
   if(!index.has(to)){visit(to);low.set(id,Math.min(low.get(id),low.get(to)));}
   else if(active.has(to))low.set(id,Math.min(low.get(id),index.get(to)));
  }
  if(low.get(id)===index.get(id)){
   const members=[];let node;
   do{node=stack.pop();active.delete(node);group.set(node,groups.length);members.push(node);}while(node!==id);
   groups.push(members);
  }
